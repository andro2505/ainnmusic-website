<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Povpraševanje | AINN Music</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>

  <main class="booking-page">

    <a href="index.html" class="booking-back">← Nazaj na stran</a>

    <section class="booking-hero">
      <p class="section-label">Povpraševanjee</p>

      <h1>Preveri prost termin.</h1>

      <p>
        Izpolni kratek obrazec in preverila bova, ali sva na tvoj datum še prosta.
        Odgovoriva v najkrajšem možnem času.
      </p>
    </section>

    <p class="booking-note">
      Polja označena z zvezdico (*) so obvezna.
    </p>

    <form class="custom-booking-form" id="booking-form">

      <input type="text" name="name" placeholder="Ime in priimek *" required>
      <input type="email" name="email" placeholder="E-poštni naslov *" required>
      <input type="tel" name="phone" placeholder="Kontaktna telefonska številka *" required>
      <input type="text" name="date" placeholder="Datum dogodka *" required>
      <input type="text" name="location" placeholder="Lokacija dogodka *" required>

      <select name="event_type" required>
        <option value="" selected disabled>Tip dogodka *</option>
        <option>Poroka</option>
        <option>Civilni obred</option>
        <option>Cerkveni obred</option>
        <option>Zasebno praznovanje</option>
        <option>Javni dogodek</option>
        <option>Pogreb</option>
        <option>Drugi</option>
      </select>

      <input type="text" name="other_event" placeholder="Če ste izbrali drugo, napišite">

      <textarea name="mood" placeholder="Kakšno glasbeno vzdušje si želite za vaš dogodek?"></textarea>

      <select name="duration" class="placeholder-select">
        <option value="" selected disabled>Okvirno trajanje glasbenega nastopa</option>
        <option>1–3 pesmi</option>
        <option>do 30 minut</option>
        <option>30–60 minut</option>
        <option>več kot 1 uro</option>
        <option>Še nisem prepričan/a</option>
      </select>

      <textarea name="message" placeholder="Dodatne želje ali vprašanja"></textarea>

      <button type="submit">Pošlji povpraševanje</button>

      <p class="booking-status" id="booking-status"></p>

    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="booking.js"></script>
</body>
</html>
